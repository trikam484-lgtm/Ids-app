<style>
:root{
  --bg:#efece4; --elev:#f7f4ee; --surf:#fffcf7; --ink:#16181d; --soft:#3a3f48;
  --muted:#6a6f66; --line:#d4cec2; --accent:#1b2a4a; --accent-fg:#f7f4ee;
  --mark:#8f2d2d; --paper:#fffdf8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
button,input,textarea{font-family:inherit}
.no-print header.app{position:sticky;top:0;z-index:20;background:var(--elev);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.ids-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;letter-spacing:1px;font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button, nav a, .btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn-mark{background:var(--mark);color:#fff;border-color:var(--mark)}
.btn-navy{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hero h1{margin:6px 0 0;font-family:Amiri,serif;font-size:32px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fff}
.form{display:grid;gap:18px;grid-template-columns:minmax(280px,26rem) 1fr}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.item-row{display:grid;grid-template-columns:2rem 1fr 5.5rem 6.5rem 2.5rem;gap:6px;align-items:center;margin-bottom:6px}
@media(max-width:900px){.form{grid-template-columns:1fr}.preview-col{display:none}.item-row{grid-template-columns:1fr}}

/* sheet */
.sheet{width:210mm;max-width:100%;min-height:277mm;background:#fff;color:#111;margin:0 auto;box-shadow:0 24px 60px rgba(27,42,74,.12)}
.sheet-frame{border:1.6px solid #111;min-height:270mm;display:flex;flex-direction:column;padding:8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px 10px;border-bottom:1.6px solid #111}
.head-ids{display:flex;gap:10px;align-items:center}
.logos{display:flex;align-items:center;gap:14px;direction:ltr}
.logos img.ricoh{height:20px;filter:grayscale(1) contrast(1.15)}
.logos img.km,.logos img.oce{height:36px;width:auto;filter:grayscale(1) contrast(1.15)}
.sheet-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 8px;border-bottom:1.6px solid #111}
.sheet-no{border:1.6px solid #111;min-width:108px;padding:6px 10px;text-align:center}
.sheet-no span{display:block;font-size:10px}
.sheet-no strong{display:block;font-size:26px}
.sheet-meta,.sheet-items{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet-meta th,.sheet-meta td,.sheet-items th,.sheet-items td{border:1px solid #111;padding:7px 8px;vertical-align:middle}
.sheet-meta th{width:18%;font-size:11px;font-weight:500;background:#f3f3f3;text-align:right}
.sheet-meta td{font-size:13px;font-weight:600}
.sheet-items{flex:1;font-size:13px}
.sheet-items th{background:#f3f3f3;font-weight:600;font-size:12px;text-align:center}
.sheet-items .c-n{width:9%;text-align:center}
.sheet-items .c-d{width:55%;text-align:right}
.sheet-items .c-q{width:16%;text-align:center}
.sheet-items .c-i{width:20%;text-align:center}
.sheet-items td{height:28px}
.sheet-notes{margin:0;border:1px solid #111;border-top:0;padding:6px 8px;font-size:12px}
.sheet-signs{display:grid;grid-template-columns:1fr 1fr;border:1.6px solid #111;border-top:0}
.sign-block{padding:10px 12px 14px}
.sign-block:first-child{border-left:1.6px solid #111}
.sign-title{margin:0 0 18px;font-size:11px;line-height:1.5;min-height:2.8em}
.sign-line{margin:18px 0 0;display:flex;align-items:flex-end;gap:8px;font-size:11px}.sign-line span{flex:1;border-bottom:2px dotted #111;height:1.1em}
.sheet-foot{display:grid;grid-template-columns:1fr 1fr;gap:16px;border:1.6px solid #111;border-top:0;padding:8px 12px;font-size:10px;line-height:1.45}
.sheet-foot p{margin:0}
@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .sheet{box-shadow:none;max-width:none;width:auto;margin:0}
  @page{size:A4 portrait;margin:8mm}
}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:700px){.filters{grid-template-columns:1fr}}
.reg{width:100%;border-collapse:collapse;font-size:13px;background:var(--surf)}
.reg th{background:var(--accent);color:var(--accent-fg);padding:10px 8px;text-align:right;font-weight:500}
.reg td{padding:8px;border-bottom:1px solid var(--line)}
.reg tr:nth-child(even){background:var(--elev)}
.reg a{color:var(--mark);font-weight:700;cursor:pointer;text-decoration:underline}
.stats{margin:0 0 12px;color:var(--muted);font-size:14px}
</style>
</head>

const APP_PIN='2026'; // غيّر الرقم ده لأي رقم سري تحبه
function pinGate(){
  if(localStorage.getItem('ids-app-unlocked')==='1')return true;
  var header=document.querySelector('.no-print');
  var appEl=document.getElementById('app');
  if(header)header.style.display='none';
  if(appEl)appEl.style.display='none';
  var overlay=document.createElement('div');
  overlay.id='pin-overlay';
  overlay.style.cssText='position:fixed;inset:0;background:#0b1220;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;font-family:inherit';
  overlay.innerHTML='<div style="font-weight:700;font-size:18px">أدخل الرقم السري</div>'+
    '<input id="pin-input" type="password" inputmode="numeric" maxlength="8" style="font-size:22px;text-align:center;padding:10px;border-radius:8px;border:1px solid #ccc;width:160px"/>'+
    '<button id="pin-btn" style="padding:10px 24px;border-radius:8px;border:none;background:#0a5;color:#fff;font-weight:700;font-size:16px;cursor:pointer">دخول</button>'+
    '<div id="pin-err" style="color:#f66;font-size:13px;height:16px"></div>';
  document.body.appendChild(overlay);
  function tryUnlock(){
    var v=document.getElementById('pin-input').value;
    if(v===APP_PIN){
      localStorage.setItem('ids-app-unlocked','1');
      overlay.remove();
      if(header)header.style.display='';
      if(appEl)appEl.style.display='';
    }else{
      document.getElementById('pin-err').textContent='رقم غلط، حاول تاني';
    }
  }
  document.getElementById('pin-btn').addEventListener('click',tryUnlock);
  document.getElementById('pin-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
  document.getElementById('pin-input').focus();
  return false;
}

const state={view:'list',list:load(),edit:null,q:'',client:'',item:'',month:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]})}
function registerRows(all){
  const client=all?'':(state.client||'').trim();
  const item=all?'':(state.item||'').trim();
  const month=all?'':(state.month||'').trim();
  const rows=[];
  state.list.forEach(function(p){
    (p.items||[]).filter(function(it){return (it.description||'').trim()}).forEach(function(it){
      if(client && !(p.customer||'').includes(client)) return;
      if(item && !(it.description||'').includes(item) && !(it.itemNo||'').includes(item)) return;
      if(month && !(p.date||'').startsWith(month)) return;
      rows.push({id:p.id,perm:p.number,date:p.date,customer:p.customer,invoice:p.invoice,desc:it.description,qty:it.quantity,itemNo:it.itemNo});
    });
  });
  return rows;
}

function go(v,edit){state.view=v;state.edit=edit||null;render()}
function newPerm(){
  state.edit={id:null,number:nextNum(state.list),date:today(),customer:'',address:'',phone:'',invoice:'',notes:'',items:[{id:uid(),description:'',quantity:1,itemNo:''}]};
  state.view='form';render();
}
function openEdit(id){
  const p=state.list.find(x=>x.id===id); if(!p)return;
  state.edit=JSON.parse(JSON.stringify(p));
  if(!state.edit.items.length) state.edit.items=[{id:uid(),description:'',quantity:1,itemNo:''}];
  state.view='form';render();
}
function val(id){var n=document.getElementById(id);return n?String(n.value||''):''}
function refreshPreview(){
  var box=document.getElementById('live-preview');
  if(!box||!state.edit) return;
  readFormIntoState();
  box.innerHTML=sheetHTML(state.edit);
}
function readFormIntoState(){
  var e=state.edit; if(!e) return e;
  var c=document.getElementById('f-customer');
  if(c){
    var num=document.getElementById('f-number');
    if(num){var nv=parseInt(num.value,10); if(nv>0) e.number=nv;}
    e.customer=val('f-customer').trim();
    e.address=val('f-address').trim();
    e.phone=val('f-phone').trim();
    e.invoice=val('f-invoice').trim();
    e.date=val('f-date')||e.date;
    e.notes=val('f-notes').trim();
    (e.items||[]).forEach(function(it,i){
      var d=document.getElementById('f-desc-'+i);
      var q=document.getElementById('f-qty-'+i);
      var n=document.getElementById('f-no-'+i);
      if(d) it.description=d.value;
      if(q) it.quantity=Number(q.value||0);
      if(n) it.itemNo=n.value;
    });
  }
  return e;
}
function saveForm(){
  var e=readFormIntoState();
  if(!e) return;
  var num=parseInt(e.number,10);
  if(!(num>0)){alert('رقم الإذن لازم يكون رقم صحيح أكبر من صفر');return}
  var dup=state.list.find(function(x){return x.number===num && x.id!==e.id});
  if(dup){
    if(!confirm('رقم الإذن '+num+' مستخدم بالفعل للعميل «'+(dup.customer||'بدون اسم')+'». تحفظ برضه؟')) return;
  }
  e.number=num;
  e.items=(e.items||[]).filter(function(i){return (i.description||'').trim()});
  if(!e.items.length) e.items=[{id:uid(),description:'',quantity:1,itemNo:''}];
  if(!e.id){e.id=uid(); e.createdAt=new Date().toISOString(); state.list.push(e);}
  else{state.list=state.list.map(function(x){return x.id===e.id?e:x})}
  save(state.list); go('print', e);
}
function excelDate(iso){return fd(iso)||''}
function exportExcel(){
  if(typeof XLSX==='undefined'){alert('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول تاني');return}
  const summary=state.list.map(function(p){return {
    'رقم الإذن':p.number,
    'التاريخ':excelDate(p.date),
    'اسم العميل':p.customer||'',
    'العنوان':p.address||'',
    'تليفون العميل':p.phone||'',
    'رقم الفاتورة / نوع العقد':p.invoice||'',
    'عدد الأصناف':(p.items||[]).filter(function(i){return (i.description||'').trim()}).length,
    'ملاحظات':p.notes||''
  }});
  const details=registerRows(true).map(function(r){return {
    'رقم الإذن':r.perm,
    'التاريخ':excelDate(r.date),
    'اسم العميل':r.customer||'',
    'رقم الفاتورة / نوع العقد':r.invoice||'',
    'الصنف':r.desc||'',
    'الكمية':r.qty||'',
    'رقم الصنف':r.itemNo||''
  }});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'الأذون');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(details),'تفاصيل الأصناف');
  XLSX.writeFile(wb,'اذون_تسليم_البضائع.xlsx');
}
function exportRegisterExcel(){
  if(typeof XLSX==='undefined'){alert('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت وحاول تاني');return}
  const rows=registerRows().map(function(r){return {
    'رقم الإذن':r.perm,
    'التاريخ':excelDate(r.date),
    'اسم العميل':r.customer||'',
    'رقم الفاتورة / نوع العقد':r.invoice||'',
    'الصنف':r.desc||'',
    'الكمية':r.qty||'',
    'رقم الصنف':r.itemNo||''
  }});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'السجل');
  XLSX.writeFile(wb,'سجل_الصرف.xlsx');
}
function downloadSelf(){
  try{
    var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='IDS_App.html';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){alert('تعذر تحميل الملف: '+e.message)}
}
function exportJson(){
  const blob=new Blob([JSON.stringify(state.list,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ids-permissions-backup.json'; a.click();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{
    const arr=JSON.parse(r.result); if(Array.isArray(arr)){ const map={}; state.list.concat(arr).forEach(p=>map[p.number]=p); save(Object.values(map)); render(); }
  }catch(e){alert('ملف غير صالح')}}; r.readAsText(f); ev.target.value='';
}

function render(){
  const el=document.getElementById('app');
  if(state.view==='list'){
    const q=(state.q||'').trim();
    const list=state.list.filter(p=>!q||p.customer.includes(q)||String(p.number).includes(q)||p.invoice.includes(q)||p.items.some(i=>i.description.includes(q)));
    el.innerHTML=`<div class="wrap no-print">
      <div class="hero">
        <div><div style="font-size:11px;letter-spacing:.22em;opacity:.7">I.D.S · DELIVERY NOTES 2026</div>
        <h1>أذون تسليم البضائع</h1></div>
        <div style="text-align:left">
          <div style="font-size:12px;opacity:.75">الرقم التالي <b style="font-size:22px">${nextNum(state.list)}</b></div>
          <button class="btn btn-mark" style="margin-top:8px" onclick="newPerm()">إذن جديد</button>
        </div>
      </div>
      <input class="search" placeholder="ابحث باسم العميل أو رقم الإذن أو الصنف" value="${state.q||''}" oninput="state.q=this.value;render()"/>
      ${list.map(p=>`<div class="card">
        <div><b style="color:var(--mark);margin-left:8px">${p.number}</b> ${p.customer||'بدون اسم'}
        <div style="font-size:13px;color:var(--muted);margin-top:4px">${p.date} · ${(p.items||[]).filter(i=>i.description).length} صنف · ${p.invoice||'بدون فاتورة'}</div></div>
        <div>
          <button class="btn" onclick="openEdit('${p.id}')">تعديل</button>
          <button class="btn btn-navy" onclick="go('print', state.list.find(x=>x.id==='${p.id}'))">عرض وطباعة</button>
        </div>
      </div>`).join('')||'<p style="text-align:center;color:var(--muted)">لا توجد أذون</p>'}
    </div>`;
    return;
  }
  if(state.view==='register'){
    const rows=registerRows();
    const qty=rows.reduce(function(s,r){return s+(Number(r.qty)||0)},0);
    el.innerHTML=`<div class="wrap">
      <div class="hero no-print">
        <div>
          <div style="font-size:11px;letter-spacing:.22em;opacity:.7">REGISTER</div>
          <h1>سجل الصرف المجمع</h1>
          <p style="opacity:.8;font-size:13px">كل الأصناف المنصرفة من الأذون — فلتر حسب العميل أو الصنف أو الشهر</p>
        </div>
        <div style="text-align:left">
          <div class="stats" style="color:#fff;opacity:.9">${rows.length} بند<br/>إجمالي الكمية <b style="font-size:22px">${qty}</b></div>
          <button class="btn" onclick="exportRegisterExcel()">تصدير النتائج Excel</button>
          <button class="btn" onclick="window.print()">طباعة السجل</button>
        </div>
      </div>
      <div class="filters no-print">
        <div class="field"><label>اسم العميل</label><input value="${esc(state.client)}" oninput="state.client=this.value;render()"/></div>
        <div class="field"><label>الصنف / رقم الصنف</label><input value="${esc(state.item)}" oninput="state.item=this.value;render()"/></div>
        <div class="field"><label>الشهر</label><input type="month" value="${esc(state.month)}" oninput="state.month=this.value;render()"/></div>
      </div>
      <p class="stats">${rows.length} بند · إجمالي الكمية ${qty}</p>
      <div style="overflow:auto;border:1px solid var(--line);border-radius:12px">
        <table class="reg">
          <thead><tr>
            <th>الإذن</th><th>التاريخ</th><th>العميل</th><th>الفاتورة / العقد</th><th>الصنف</th><th style="text-align:center">الكمية</th><th>رقم الصنف</th>
          </tr></thead>
          <tbody>
            ${rows.map(function(r){return `<tr>
              <td><a onclick="go('print', state.list.find(function(x){return x.id==='${r.id}'}))">${r.perm}</a></td>
              <td>${esc(r.date)}</td>
              <td>${esc(r.customer)}</td>
              <td>${esc(r.invoice)}</td>
              <td>${esc(r.desc)}</td>
              <td style="text-align:center">${r.qty||''}</td>
              <td>${esc(r.itemNo)}</td>
            </tr>`}).join('') || '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">لا توجد بنود مطابقة</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
    return;
  }
  if(state.view==='form'){
    const e=state.edit;
    const items=e.items.map((it,i)=>`<div class="item-row">
      <span style="text-align:center;color:var(--muted)">${i+1}</span>
      <input id="f-desc-${i}" value="${esc(it.description||'')}" oninput="refreshPreview()" placeholder="اسم الصنف"/>
      <input id="f-qty-${i}" type="number" min="0" value="${it.quantity||0}" oninput="refreshPreview()"/>
      <input id="f-no-${i}" value="${esc(it.itemNo||'')}" oninput="refreshPreview()" placeholder="رقم الصنف"/>
      <button class="btn" onclick="if(state.edit.items.length>1){state.edit.items.splice(${i},1);render()}">×</button>
    </div>`).join('');
    el.innerHTML=`<div class="wrap">
      <div class="no-print" style="margin-bottom:16px">
        <div style="font-size:12px;color:var(--muted)">${e.id?'تعديل إذن':'إذن جديد'}</div>
        <div class="field" style="max-width:160px;margin-bottom:0">
          <label>رقم الإذن</label>
          <input id="f-number" type="number" min="1" step="1" value="${e.number}" oninput="refreshPreview()" style="font-size:22px;font-weight:700;color:var(--mark)"/>
        </div>
      </div>
      <div class="form">
        <div class="no-print">
          <div class="field"><label>اسم العميل</label><input id="f-customer" value="${esc(e.customer||'')}" oninput="refreshPreview()"/></div>
          <div class="field"><label>العنوان</label><input id="f-address" value="${esc(e.address||'')}" oninput="refreshPreview()"/></div>
          <div class="field"><label>تليفون العميل</label><input id="f-phone" value="${esc(e.phone||'')}" oninput="refreshPreview()"/></div>
          <div class="field"><label>تاريخ التسليم</label><input id="f-date" type="date" value="${esc(e.date||'')}" oninput="refreshPreview()"/></div>
          <div class="field"><label>رقم الفاتورة / نوع العقد</label><input id="f-invoice" value="${esc(e.invoice||'')}" oninput="refreshPreview()" placeholder="عقد صيانة شامل / عقد إيجار / استبدال"/></div>
          <h3 style="font-size:14px">الأصناف</h3>
          ${items}
          <button class="btn" onclick="readFormIntoState();state.edit.items.push({id:uid(),description:'',quantity:1,itemNo:''});render()">+ إضافة صنف</button>
          <div class="field" style="margin-top:12px"><label>ملاحظات</label><textarea id="f-notes" rows="2" oninput="refreshPreview()">${esc(e.notes||'')}</textarea></div>
          <button class="btn btn-mark" onclick="saveForm()">حفظ وعرض للطباعة</button>
        </div>
        <div id="live-preview" class="preview-col" style="transform:scale(.78);transform-origin:top right">${sheetHTML(e)}</div>
      </div>
    </div>`;
    return;
  }
  if(state.view==='print'){
    const p=state.edit;
    el.innerHTML=`<div class="wrap no-print" style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" onclick="go('list')">العودة</button>
      <button class="btn" onclick="openEdit('${p.id}')">تعديل</button>
      <button class="btn btn-mark" onclick="window.print()">طباعة A4</button>
    </div>${sheetHTML(p)}`;
  }
}
if(window.Telegram && window.Telegram.WebApp){
  try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }catch(e){}
}
pinGate();
if(CLOUD_DOC){
  CLOUD_DOC.onSnapshot(function(doc){
    if(doc.exists){
      var data=doc.data();
      if(Array.isArray(data.list)){
        state.list=data.list.slice().sort((a,b)=>b.number-a.number);
        localStorage.setItem(KEY,JSON.stringify(state.list));
        if(state.view!=='form'){render()}
      }
    }else{
      CLOUD_DOC.set({list:state.list,updatedAt:Date.now()}).catch(function(e){console.error('Cloud init failed',e)});
    }
  },function(err){console.error('Cloud sync error',err)});
}
render();
</script>
